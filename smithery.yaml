# Smithery configuration for Ryanair Flight Planner MCP Server
# https://smithery.ai/docs/config
build:
  dockerfile: Dockerfile
startCommand:
  type: stdio
  config:
    command: /app/ryanair-mcp-server
    args: []
    env:
      RYANAIR_CURRENCY: "EUR"
      RYANAIR_RADIUS_KM: "150"
      RYANAIR_DEFAULT_ORIGIN: ""
