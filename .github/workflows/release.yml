name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin, goarch: arm64, name: darwin-arm64 }
          - { goos: darwin, goarch: amd64, name: darwin-amd64 }
          - { goos: linux, goarch: amd64, name: linux-amd64 }
          - { goos: linux, goarch: arm64, name: linux-arm64 }
          - { goos: windows, goarch: amd64, name: windows-amd64, ext: .exe }
          - { goos: windows, goarch: arm64, name: windows-arm64, ext: .exe }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: |
          BIN_NAME="ryanair-mcp-server${{ matrix.target.ext }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.vars.outputs.VERSION }}" -o "dist/$BIN_NAME" .

      - name: Package Archive
        id: package
        run: |
          mkdir -p release_assets
          ARCHIVE_NAME="ryanair-mcp-${{ steps.vars.outputs.VERSION }}-${{ matrix.target.name }}"
          BIN_NAME="ryanair-mcp-server${{ matrix.target.ext }}"

          cp dist/$BIN_NAME release_assets/
          cp README.md LICENSE release_assets/ 2>/dev/null || true

          cd release_assets
          if [ "${{ matrix.target.goos }}" = "windows" ]; then
            zip -9 "${ARCHIVE_NAME}.zip" "$BIN_NAME" README.md LICENSE
            echo "ASSET_PATH=release_assets/${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT
            echo "ASSET_NAME=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "$BIN_NAME" README.md LICENSE
            echo "ASSET_PATH=release_assets/${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
            echo "ASSET_NAME=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ASSET_NAME }}
          path: ${{ steps.package.outputs.ASSET_PATH }}

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files

      - name: Prepare Release Directory & Checksums
        id: checksums
        run: |
          mkdir -p final_release
          find release_files -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} final_release/ \;
          cd final_release
          sha256sum * > checksums.txt
          echo "Computed SHA256 checksums:"
          cat checksums.txt

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "Release ${{ steps.vars.outputs.TAG }}"
          draft: false
          prerelease: false
          files: |
            final_release/*
          generate_release_notes: true
