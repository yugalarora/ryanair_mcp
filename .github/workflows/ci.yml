name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GOPROXY: direct

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go-version: [ 'stable' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify

      - name: Vet
        run: |
          go vet ./...

      - name: Run Tests
        run: |
          go test -v -race ./...

      - name: Build Binary
        run: |
          go build -v -o ryanair-mcp-server .
